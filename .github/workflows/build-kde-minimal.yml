name: Build Debian HDMI KDE Minimal ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build-kde-minimal.yml'

permissions:
  contents: read

jobs:
  build-kde-minimal:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 360
    steps:
      - name: Check out builder configuration
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git live-build debootstrap xorriso \
            isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub2-common \
            squashfs-tools dosfstools mtools rsync

      - name: Prepare isolated KDE minimal configuration
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/kde-minimal-build"
          cp -a "$GITHUB_WORKSPACE/config" "$RUNNER_TEMP/kde-minimal-build/config"
          rm -f "$RUNNER_TEMP/kde-minimal-build/config/package-lists/"*.list.chroot
          cat > "$RUNNER_TEMP/kde-minimal-build/config/package-lists/kde-minimal.list.chroot" <<'PACKAGES'
          # KDE Plasma desktop, deliberately avoiding the full task-kde-desktop bundle.
          plasma-desktop
          kwin-x11
          sddm
          xserver-xorg
          dbus-x11
          dolphin
          konsole
          systemsettings
          kde-cli-tools
          plasma-nm
          plasma-pa
          polkit-kde-agent-1
          udisks2
          upower
          network-manager
          wpasupplicant
          user-setup
          calamares
          calamares-settings-debian
          firmware-intel-graphics
          firmware-misc-nonfree
          intel-microcode
          sudo
          PACKAGES
          test -s "$RUNNER_TEMP/kde-minimal-build/config/includes.chroot/etc/default/grub.d/99-hdmi-only.cfg"
          test -s "$RUNNER_TEMP/kde-minimal-build/config/includes.chroot/etc/initramfs-tools/modules"
          test -s "$RUNNER_TEMP/kde-minimal-build/config/includes.chroot/etc/modprobe.d/99-intel-graphics.conf"

      - name: Configure minimal KDE Debian live image
        working-directory: ${{ runner.temp }}/kde-minimal-build
        run: |
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --initsystem systemd \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends false \
            --security false \
            --debian-installer false \
            --bootappend-live "boot=live components hostname=debian-hdmi-kde-minimal i915.modeset=1 video=eDP-1:d video=HDMI-A-1:e"

      - name: Validate minimal KDE package selection
        working-directory: ${{ runner.temp }}/kde-minimal-build
        run: |
          set -eux
          grep -Ev '^[[:space:]]*(#|$)' config/package-lists/kde-minimal.list.chroot
          test ! -e config/package-lists/desktop.list.chroot
          ! grep -Eq '^(task-kde-desktop|kde-full|libreoffice|firefox-esr)$' config/package-lists/kde-minimal.list.chroot

      - name: Build minimal KDE ISO
        working-directory: ${{ runner.temp }}/kde-minimal-build
        run: |
          set -eux
          lb build
          mkdir -p "$RUNNER_TEMP/output"
          cp -v ./*.iso "$RUNNER_TEMP/output/debian-13-trixie-amd64-kde-plasma-minimal-hdmi.iso"
          cd "$RUNNER_TEMP/output"
          sha256sum *.iso > SHA256SUMS

      - name: Upload minimal KDE ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-hdmi-kde-plasma-minimal-iso
          path: |
            ${{ runner.temp }}/output/*.iso
            ${{ runner.temp }}/output/SHA256SUMS
          compression-level: 0
          retention-days: 7
