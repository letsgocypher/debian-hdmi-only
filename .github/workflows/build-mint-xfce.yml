name: Build Linux Mint HDMI XFCE ISO # manually triggered remaster

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-mint-xfce.yml'

permissions:
  contents: write

jobs:
  build-mint-xfce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install ISO remastering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools rsync python3 curl ca-certificates

      - name: Cache official Linux Mint ISO
        id: mint-iso-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mint/original.iso
          key: linux-mint-22.3-xfce-64bit-iso-v1

      - name: Download and verify official Linux Mint ISO (cache miss only)
        if: steps.mint-iso-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/mint"
          cd "$RUNNER_TEMP/mint"
          ISO_URL="https://mirrors.edge.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-xfce-64bit.iso"
          for attempt in $(seq 1 12); do
            if curl -fL --connect-timeout 30 --retry 5 --retry-all-errors --retry-delay 3 \
              --continue-at - "$ISO_URL" -o original.iso; then
              break
            fi
            echo "ISO download attempt $attempt failed; retrying from the partial file..."
            sleep 5
          done
          test -s original.iso

      - name: Verify official Linux Mint ISO (cached or newly downloaded)
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mint"
          test -s original.iso
          curl -fL --connect-timeout 30 --retry 10 --retry-all-errors --retry-delay 3 \
            "https://mirrors.edge.kernel.org/linuxmint/stable/22.3/sha256sum.txt" -o sha256sum.txt
          awk '$2 ~ /linuxmint-22.3-xfce-64bit.iso$/ {print $1 "  original.iso"; found=1} END {if (!found) exit 1}' sha256sum.txt | sha256sum -c -

      - name: Extract official live filesystem
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mint"
          mkdir iso-root
          xorriso -osirrox on -indev original.iso -extract / iso-root
          chmod -R u+w iso-root
          test -s iso-root/casper/filesystem.squashfs
          # Extract as root so SquashFS ownership and extended attributes are preserved.
          sudo unsquashfs -d rootfs iso-root/casper/filesystem.squashfs

      - name: Apply safe cleanup and HDMI configuration
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mint"

          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /dev/pts rootfs/dev/pts
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

          sudo chroot rootfs /bin/bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y linux-firmware intel-microcode

            # Aggressive size-focused profile targeting an ISO around 1.5 GB.
            # Preserve XFCE, Firefox, Mint core tools, installer, Intel firmware,
            # Wi-Fi/networking, and recovery essentials.
            mapfile -t removable < <(
              dpkg-query -W -f='\${binary:Package}\\n' 2>/dev/null |
              grep -E '^(libreoffice|thunderbird|hypnotix|celluloid|pix|drawing|simple-scan|warpinator|webapp-manager|transmission|aisleriot|gnome-mahjongg|gnome-mines|gnome-sudoku|five-or-more|four-in-a-row|gnome-klotski|gnome-nibbles|gnome-robots|gnome-taquin|gnome-tetravex|iagno|lightsoff|swell-foop|cups|printer-driver-|sane-|blueman|blueberry|bluetooth|bluez|cheese|rhythmbox|shotwell|gnome-calendar|gnome-contacts|gnome-maps|gnome-weather|gnome-clocks|gnome-music|evolution|hexchat|pidgin)' || true
            )
            if [ "${#removable[@]}" -gt 0 ]; then
              apt-get purge -y "${removable[@]}"
            fi

            # Drop orphaned dependencies left by the removed applications.
            apt-get autoremove --purge -y
            apt-get clean
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*

            # Documentation and translation catalogs are not needed in the live image.
            rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/info/*
            find /usr/share/locale -mindepth 1 -maxdepth 1 \\
              ! -name 'en' ! -name 'en_*' ! -name 'locale.alias' \\
              -exec rm -rf {} +


            mkdir -p /etc/default/grub.d
            cat > /etc/default/grub.d/99-hdmi-only.cfg <<'"'"'GRUB'"'"'
          # HDMI-focused Intel graphics configuration for Lenovo IdeaPad 310-15ISK.
          # Connector names are provisional and must be verified on the actual laptop.
          GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT i915.modeset=1 video=eDP-1:d video=HDMI-A-1:e"
          GRUB

            mkdir -p /etc/initramfs-tools
            touch /etc/initramfs-tools/modules
            grep -qxF i915 /etc/initramfs-tools/modules || echo i915 >> /etc/initramfs-tools/modules
            printf "options i915 modeset=1\\n" > /etc/modprobe.d/99-intel-graphics.conf
            update-initramfs -u -k all
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '

          # Detach virtual filesystems before repacking; never include host /proc, /sys or /dev.
          # sysfs can remain busy after package hooks; lazy-detach it so it is
          # excluded from the image without blocking the rebuild.
          sudo umount -l rootfs/sys
          sudo umount rootfs/proc
          sudo umount rootfs/dev/pts
          sudo umount rootfs/dev

          # Add the same HDMI parameters to Mint's live boot menu entries.
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("iso-root")
          changed = []
          args = "i915.modeset=1 video=eDP-1:d video=HDMI-A-1:e"
          for path in root.rglob("*"):
              if not path.is_file() or path.name not in {"grub.cfg", "txt.cfg"}:
                  continue
              try:
                  text = path.read_text(errors="replace")
              except OSError:
                  continue
              lines = text.splitlines(keepends=True)
              out = []
              for line in lines:
                  if "boot=casper" in line and args not in line:
                      if "---" in line:
                          line = line.replace("---", args + " ---", 1)
                      else:
                          line = line.rstrip("\n") + " " + args + "\n"
                  out.append(line)
              new_text = "".join(out)
              if new_text != text:
                  path.write_text(new_text)
                  changed.append(str(path.relative_to(root)))
          if not changed:
              raise SystemExit("No Mint live boot entries containing boot=casper were found; refusing to publish an unconfigured ISO.")
          print("Updated live boot files:", ", ".join(changed))
          PY

          # Rebuild the compressed root filesystem.
          sudo mksquashfs rootfs iso-root/casper/filesystem.squashfs.new \
            -noappend -comp xz -b 1M
          sudo mv iso-root/casper/filesystem.squashfs.new iso-root/casper/filesystem.squashfs
          sudo chown -R "$(id -u):$(id -g)" iso-root
          printf '%s' "$(du -sx --block-size=1 rootfs | cut -f1)" > iso-root/casper/filesystem.size
          dpkg-query --admindir=rootfs/var/lib/dpkg -W --showformat='${Package} ${Version}\\n' \
            | sort > iso-root/casper/filesystem.manifest
          grep -Ev '^(casper|ubiquity|ubiquity-frontend-gtk|live-boot|live-config) ' \
            iso-root/casper/filesystem.manifest > iso-root/casper/filesystem.manifest-desktop

          cd iso-root
          rm -f MD5SUMS
          find . -type f ! -name 'MD5SUMS' ! -path './isolinux/boot.cat' -print0 \
            | sort -z | xargs -0 md5sum > MD5SUMS
          cd ..

      - name: Rebuild bootable hybrid ISO
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mint"
          args=( -indev original.iso -outdev "$RUNNER_TEMP/linux-mint-22.3-xfce-hdmi.iso" )
          args+=( -map iso-root/casper/filesystem.squashfs /casper/filesystem.squashfs )
          args+=( -map iso-root/casper/filesystem.size /casper/filesystem.size )
          args+=( -map iso-root/casper/filesystem.manifest /casper/filesystem.manifest )
          args+=( -map iso-root/casper/filesystem.manifest-desktop /casper/filesystem.manifest-desktop )
          args+=( -map iso-root/MD5SUMS /MD5SUMS )
          while IFS= read -r -d '' file; do
            rel="${file#iso-root/}"
            args+=( -map "$file" "/$rel" )
          done < <(find iso-root -type f \( -name grub.cfg -o -name txt.cfg \) -print0)
          args+=( -boot_image any replay -compliance no_emul_toc -padding included )
          xorriso "${args[@]}"
          xorriso -indev "$RUNNER_TEMP/linux-mint-22.3-xfce-hdmi.iso" -report_el_torito plain
          mkdir -p "$RUNNER_TEMP/output"
          cp "$RUNNER_TEMP/linux-mint-22.3-xfce-hdmi.iso" "$RUNNER_TEMP/output/"
          cd "$RUNNER_TEMP/output"
          sha256sum *.iso > SHA256SUMS

      - name: Upload customized ISO
        uses: actions/upload-artifact@v4
        with:
          name: linux-mint-22.3-xfce-hdmi-iso
          path: |
            ${{ runner.temp }}/output/*.iso
            ${{ runner.temp }}/output/SHA256SUMS
          compression-level: 0
          retention-days: 7

      - name: Split ISO for GitHub Releases (2 GiB per-file limit)
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/output"
          iso=( *.iso )
          test "${#iso[@]}" -eq 1
          split -b 1900M -d -a 2 "${iso[0]}" "${iso[0]}.part"
          ls -lh "${iso[0]}".part*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mint-22.3-xfce-hdmi-build-${{ github.run_number }}
          name: Linux Mint 22.3 XFCE HDMI Edition — Build #${{ github.run_number }}
          body: |
            Community remaster based on the official Linux Mint 22.3 XFCE ISO.

            Aggressively slimmed XFCE profile targeting approximately 1.5 GB: optional office, media, chat, games, printing/scanning, Bluetooth UI, documentation, and non-English locale data removed. XFCE, Firefox, Mint core tools, installer, Intel firmware, Wi-Fi/networking, and recovery essentials retained. Actual size depends on package resolution and must be verified after build.
            Connector names are provisional; test the live session on the target laptop before installing.

            The ISO is split into numbered 1,900 MiB parts to fit GitHub's per-file release limit.
            Download every .part file into one folder and reassemble with:
            cat linux-mint-22.3-xfce-hdmi.iso.part* > linux-mint-22.3-xfce-hdmi.iso
            Verify the reconstructed ISO using SHA256SUMS.
          files: |
            ${{ runner.temp }}/output/SHA256SUMS
            ${{ runner.temp }}/output/*.iso.part*
          fail_on_unmatched_files: true

# Verified mirror checksum path: stable/22.3.
