name: Build Debian HDMI XFCE ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/build-xfce.yml'

permissions:
  contents: write

jobs:
  build-xfce:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 360
    steps:
      - name: Check out builder configuration
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git live-build debootstrap xorriso \
            isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub2-common \
            squashfs-tools dosfstools mtools rsync

      - name: Prepare complete XFCE desktop package selection
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/xfce-build"
          cp -a "$GITHUB_WORKSPACE/config" "$RUNNER_TEMP/xfce-build/config"
          rm -f "$RUNNER_TEMP/xfce-build/config/package-lists/"*.list.chroot
          cat > "$RUNNER_TEMP/xfce-build/config/package-lists/xfce.list.chroot" <<'PACKAGES'
          # Full Debian XFCE desktop task; keep recommended packages for a complete desktop.
          task-xfce-desktop
          calamares
          calamares-settings-debian
          user-setup
          network-manager
          wpasupplicant
          sudo
          firmware-intel-graphics
          firmware-misc-nonfree
          intel-microcode
          greybird-gtk-theme
          papirus-icon-theme
          xfce4-whiskermenu-plugin
          xfce4-goodies
          xfce4-appfinder
          xfce4-screenshooter
          xfce4-taskmanager
          xfce4-power-manager
          xfce4-pulseaudio-plugin
          xfce4-notifyd
          thunar-volman
          thunar-archive-plugin
          tumbler
          ristretto
          mousepad
          pavucontrol
          network-manager-gnome
          blueman
          file-roller
          fonts-cantarell
          fonts-noto-color-emoji
          PACKAGES

          # Set clean Debian XFCE defaults for new users.
          mkdir -p "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml"
          cat > "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Arc-Darker"/>
              <property name="IconThemeName" type="string" value="Papirus-Dark"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="FontName" type="string" value="Cantarell 10"/>
              <property name="MonospaceFontName" type="string" value="Monospace 10"/>
              <property name="CursorThemeName" type="string" value="Adwaita"/>
              <property name="CursorSize" type="int" value="24"/>
            </property>
          </channel>
          XML
          mkdir -p "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml"
          cat > "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Arc-Darker"/>
              <property name="title_font" type="string" value="Cantarell Bold 10"/>
              <property name="button_layout" type="string" value="O|HMC"/>
            </property>
          </channel>
          XML
          # Ship a consistent XFCE first-login profile.
          # XFCE reads these defaults from /etc/skel for every newly created user.
          PANEL_DIR="$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml"
          mkdir -p "$PANEL_DIR"
          cat > "$PANEL_DIR/xfce4-panel.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="configver" type="int" value="2"/>
            <property name="panels" type="array">
              <value type="int" value="1"/>
            </property>
            <property name="panels" type="empty">
              <property name="panel-1" type="empty">
                <property name="position" type="string" value="p=8;x=0;y=0"/>
                <property name="length" type="uint" value="100"/>
                <property name="position-locked" type="bool" value="true"/>
                <property name="size" type="uint" value="36"/>
                <property name="icon-size" type="uint" value="16"/>
                <property name="length-adjust" type="bool" value="true"/>
                <property name="autohide-behavior" type="uint" value="0"/>
                <property name="mode" type="uint" value="0"/>
                <property name="plugin-ids" type="array">
                  <value type="int" value="1"/>
                  <value type="int" value="2"/>
                  <value type="int" value="3"/>
                  <value type="int" value="4"/>
                  <value type="int" value="5"/>
                  <value type="int" value="6"/>
                  <value type="int" value="7"/>
                </property>
              </property>
            </property>
            <property name="plugins" type="empty">
              <property name="plugin-1" type="string" value="whiskermenu"/>
              <property name="plugin-2" type="string" value="separator"/>
              <property name="plugin-3" type="string" value="tasklist"/>
              <property name="plugin-4" type="string" value="separator"/>
              <property name="plugin-5" type="string" value="systray"/>
              <property name="plugin-6" type="string" value="pulseaudio"/>
              <property name="plugin-7" type="string" value="clock"/>
            </property>
          </channel>
          XML
          # Keep the desktop clean and familiar: home/trash icons, readable labels.
          cat > "$PANEL_DIR/xfce4-desktop.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="desktop-icons" type="empty">
              <property name="style" type="int" value="2"/>
              <property name="file-icons" type="empty">
                <property name="show-home" type="bool" value="true"/>
                <property name="show-filesystem" type="bool" value="false"/>
                <property name="show-trash" type="bool" value="true"/>
                <property name="show-removable" type="bool" value="true"/>
              </property>
            </property>
          </channel>
          XML
          # Use Debian's Greybird theme with Papirus icons.
          sed -i 's/value="Arc-Darker"/value="Greybird"/g; s/value="Papirus-Dark"/value="Papirus"/g' "$PANEL_DIR/xsettings.xml" "$PANEL_DIR/xfwm4.xml"
          test -s "$PANEL_DIR/xfce4-panel.xml"
          test -s "$PANEL_DIR/xfce4-desktop.xml"

          test -s "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/default/grub.d/99-hdmi-only.cfg"
          test -s "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/initramfs-tools/modules"
          test -s "$RUNNER_TEMP/xfce-build/config/includes.chroot/etc/modprobe.d/99-intel-graphics.conf"

      - name: Configure Debian XFCE live image
        working-directory: ${{ runner.temp }}/xfce-build
        run: |
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --initsystem systemd \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --security false \
            --debian-installer false \
            --bootappend-live "boot=live components hostname=debian-hdmi-xfce i915.modeset=1 video=eDP-1:d video=HDMI-A-1:e" \
            --bootappend-live-failsafe "boot=live components hostname=debian-hdmi-xfce i915.modeset=1 video=eDP-1:d video=HDMI-A-1:e"

      - name: Build ISO
        working-directory: ${{ runner.temp }}/xfce-build
        run: |
          set -eux
          lb build
          mkdir -p "$RUNNER_TEMP/output"
          cp -v ./*.iso "$RUNNER_TEMP/output/debian-13-trixie-amd64-xfce-hdmi.iso"
          cd "$RUNNER_TEMP/output"
          sha256sum *.iso > SHA256SUMS

      - name: Upload XFCE ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-hdmi-xfce-iso
          path: |
            ${{ runner.temp }}/output/*.iso
            ${{ runner.temp }}/output/SHA256SUMS
          compression-level: 0
          retention-days: 7

      - name: Split ISO for GitHub Releases (2 GiB per-file limit)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/output"
          iso=( *.iso )
          test "${#iso[@]}" -eq 1
          split -b 1900M -d -a 2 "${iso[0]}" "${iso[0]}.part"
          ls -lh "${iso[0]}".part*

      - name: Publish Debian XFCE GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian-13-xfce-hdmi-build-${{ github.run_number }}
          name: Debian 13 XFCE HDMI Edition — Build #${{ github.run_number }}
          body: |
            Debian 13 Trixie XFCE live ISO with a complete XFCE desktop.

            Includes Greybird theme, Papirus icons, Whisker menu, XFCE utilities, Calamares installer,
            Intel graphics firmware/microcode, and HDMI-focused boot parameters.

            The ISO is split into numbered 1,900 MiB parts to fit GitHub's per-file release limit.
            Download every .part file into one folder and reassemble with:
            cat debian-13-trixie-amd64-xfce-hdmi.iso.part* > debian-13-trixie-amd64-xfce-hdmi.iso
            Verify the reconstructed ISO using SHA256SUMS.

            HDMI connector names are provisional; test the live session on the target laptop
            before installing. This is Debian, not an official Linux Mint release.
          files: |
            ${{ runner.temp }}/output/SHA256SUMS
            ${{ runner.temp }}/output/*.iso.part*
          fail_on_unmatched_files: true
