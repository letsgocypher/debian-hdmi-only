name: Publish Debian HDMI Desktop Editions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-xfce-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful KDE Plasma ISO build
        uses: actions/download-artifact@v4
        with:
          name: debian-hdmi-kde-iso
          repository: ${{ github.repository }}
          run-id: 43588200983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/kde

      - name: Download successful XFCE ISO build
        uses: actions/download-artifact@v4
        with:
          name: debian-hdmi-xfce-iso
          repository: ${{ github.repository }}
          run-id: 43600814222
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/xfce

      - name: Verify both ISOs and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s downloads/kde/debian-13-trixie-amd64-kde-hdmi.iso
          test -s downloads/kde/SHA256SUMS
          (cd downloads/kde && sha256sum --check SHA256SUMS)
          test -s downloads/xfce/debian-13-trixie-amd64-xfce-hdmi.iso
          test -s downloads/xfce/SHA256SUMS
          (cd downloads/xfce && sha256sum --check SHA256SUMS)
          mkdir -p release-assets
          cp downloads/kde/debian-13-trixie-amd64-kde-hdmi.iso release-assets/
          cp downloads/xfce/debian-13-trixie-amd64-xfce-hdmi.iso release-assets/
          cp downloads/kde/SHA256SUMS release-assets/SHA256SUMS-kde.txt
          cp downloads/xfce/SHA256SUMS release-assets/SHA256SUMS-xfce.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian-13-hdmi-desktops-2026.11.14
          name: Debian 13 HDMI Desktop Editions - KDE Plasma and XFCE
          target_commitish: 140e6ecbb9eb27face8584220acb96f2e647abe2
          body: |
            ## Debian 13 (Trixie) HDMI Desktop Editions

            Two full amd64 live ISO editions, built from successful GitHub Actions runs and checksum-verified before release.

            ### KDE Plasma
            - Full Debian KDE Plasma desktop build
            - Calamares installer and Debian Calamares settings
            - Intel graphics firmware/microcode and HDMI-oriented i915 boot parameters

            ### XFCE
            - Full Debian XFCE desktop task with normal recommended packages
            - Calamares installer and Debian Calamares settings
            - NetworkManager and Wi-Fi support
            - Intel graphics firmware/microcode and HDMI-oriented i915 boot parameters

            ### Important hardware notes
            The eDP-1 and HDMI-A-1 connector names are provisional and hardware-dependent; physical HDMI output has not been verified on every device. Linux kernel parameters do not change BIOS/UEFI video output. Test the live desktop over HDMI before installing, and carefully verify the target disk in Calamares.

            Separate SHA256 checksum files are attached for each ISO.
          files: |
            release-assets/debian-13-trixie-amd64-kde-hdmi.iso
            release-assets/SHA256SUMS-kde.txt
            release-assets/debian-13-trixie-amd64-xfce-hdmi.iso
            release-assets/SHA256SUMS-xfce.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
